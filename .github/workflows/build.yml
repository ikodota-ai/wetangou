name: Build & Verify

# dytuangou 项目 CI 流水线（D4）
# 触发：master 分支 push / pull_request
# 步骤：
# 1) 拉取代码
# 2) 设置 JDK 17 (Maven) + Node 18 (前端)
# 3) 缓存 Maven ~/.m2 + npm ~/.npm
# 4) mvn -B clean package（后端 7 模块编译 + 单元测试）
# 5) ruoyi-ui npm ci + npm run build:prod（前端产物到 dist/）
# 6) 上传 ruoyi-admin/target/*.jar + ruoyi-ui/dist 作为 artifact
#
# 能力边界（重要，别被绿勾误导）：
# 本流水线只保证「干净环境能编译打包 + 前端能 build + 没有漏提交文件」。
# 依赖真实 MySQL 的端到端 smoke（.github/scripts/smoke-*.sh，62 个脚本 700+ 断言）
# CI 一律不跑，只做 bash -n 语法校验 —— macos-14 runner 没 docker、缺 mysql-client，
# 且 GitHub Actions 的 service container 是 Linux-only，在 macOS runner 上无效。
# 业务正确性（跨租户隔离、越权、核销链路）必须由开发者本地跑 smoke 验证。

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Set up Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ruoyi-ui/package-lock.json

      - name: Lint mybatis mapper XML
        run: bash .github/scripts/lint-mybatis.sh

      - name: Backend - mvn package
        run: mvn -B -e -ntp clean package
        env:
          MAVEN_OPTS: -Xmx2g

      - name: Frontend - npm ci + build
        working-directory: ruoyi-ui
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build:prod

      - name: Upload backend jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-admin-jar
          path: ruoyi-admin/target/ruoyi-admin.jar
          if-no-files-found: error

      - name: Upload frontend dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ruoyi-ui-dist
          path: ruoyi-ui/dist
          if-no-files-found: warn

  smoke:
    name: Smoke Script Lint (syntax only)
    runs-on: macos-14
    timeout-minutes: 10
    needs: build
    if: github.event_name == 'push'  # PR 不跑（避免 PR 触发改 DB）

    # 注意：这里刻意不声明 services.mysql —— service container 是 Linux-only 特性，
    # 在 macos runner 上会被静默忽略（原来声明了 mysql:5.7 但从未生效，属于误导性死配置，已删）。
    # 因此本 job 只做 smoke 脚本的语法静态检查，不起服务、不连 DB。
    # 真正的端到端 smoke 由开发者本地跑：bash .github/scripts/smoke-<id>.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate all smoke scripts syntax
        run: bash .github/scripts/lint-smoke.sh

