# =============================================================
# 生产环境 profile：阿里云 OSS + HTTPS
# 启用方式（任选其一）：
#   1) java -jar ruoyi-admin.jar --spring.profiles.active=aliyun-oss
#   2) SERVER_PORT=8080 SPRING_PROFILES_ACTIVE=aliyun-oss java -jar ruoyi-admin.jar
#   3) 配 application.yml 的 spring.profiles.active=aliyun-oss
# =============================================================

# 数据源（密码从环境变量读，不入 git）
spring:
  datasource:
    druid:
      master:
        url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:dytuangou}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
        username: ${DB_USER:root}
        password: ${DB_PASSWORD}
      slave:
        enabled: false

  # Redis
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}

  # 邮件（可选）
  mail:
    host: ${MAIL_HOST:smtpdm.aliyun.com}
    port: 465
    username: ${MAIL_USER}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

# Tomcat
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

# 关闭 devtools + 调整日志
logging:
  level:
    com.ruoyi: info
    org.springframework: warn
  file:
    name: ${LOG_PATH:/var/log/dytuangou}/ruoyi-admin.log

ruoyi:
  # 项目信息
  name: 洞天团购
  version: 1.0.1
  copyrightYear: 2026
  # 文件路径（OSS 模式下仅作为兼容占位，实际写到 OSS）
  profile: /var/dytuangou/uploadPath
  # 是否显示获取 IP 开关
  addressEnabled: false

  # ============================
  # 对象存储：阿里云 OSS
  # ============================
  storage:
    type: oss
    s3:
      # 阿里云 OSS endpoint（注意：用 bucket 子域名格式以兼容 MinIO SDK）
      #   国内通用：https://oss-cn-hangzhou.aliyuncs.com
      #   路径风格需要在 OSS 控制台开启（默认开）
      endpoint: ${OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
      region: ${OSS_REGION:cn-hangzhou}
      bucket: ${OSS_BUCKET:wetangou-prod}
      access-key: ${OSS_ACCESS_KEY}
      secret-key: ${OSS_SECRET_KEY}
      # 可选：CDN 域名（如 https://cdn.example.com），配置后 URL 走 CDN
      public-domain: ${OSS_CDN_DOMAIN:}

# Token 配置
token:
  # 通用 header
  header: Authorization
  # 秘钥（必须 32 位以上随机）
  secret: ${JWT_SECRET:please-change-this-secret-to-32-random-chars}

# 防止 XSS
xss:
  enabled: true
  excludes:
    - /system/notice/*
    - /system/config/*

# 用户管理相关
user:
  password:
    # 密码传输中加密（不传明文）
    maxRetryCount: 5

# 验证码
captcha:
  enabled: false
  type: math

# 微信小程序
wx:
  ma:
    # 默认小程序 appid（生产用真实 appid）
    appid: ${WX_APPID:wx9e147c4e2151b123}
    secret: ${WX_SECRET}
