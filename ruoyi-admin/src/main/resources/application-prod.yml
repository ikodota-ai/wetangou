# 生产环境配置（prod profile）
#
# 为什么把 druid 数据源配置原样搬过来：
#   application.yml 里只设了 spring.profiles.active=druid，
#   一旦用 -Dspring.profiles.active=prod 启动，druid yml 就不会被加载，
#   DruidProperties 的 @Value 全部报「Could not resolve placeholder」启动失败。
#   所以 prod profile 必须自带一份等价的数据源配置，prod 才能独立启动。
#
# 同时：本文件保留 WxPayConfig / WxMaConfig 通过 environment.getActiveProfiles()
# 检测到 prod 时强制 isMockEnabled()=false 的能力（无需额外配置）。
#
# 切换到阿里云 RDS / OSS 时改下面 spring.datasource.druid.master.url
# 和 application.yml 里的 ruoyi.storage 段即可。

# 数据源配置
spring:
    # 生产关闭热部署（application.yml 里默认开着，devtools 多占内存且有安全风险）
    devtools:
        restart:
            enabled: false
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                # 生产用环境变量注入（见 doc/上线配置清单-2026-08-20.md）
                url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ry-vue}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=${DB_USE_SSL:true}&serverTimezone=GMT%2B8
                username: ${DB_USER:root}
                password: ${DB_PASSWORD:133301}
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                # 生产默认关闭监控页（暴露 SQL/URL/会话信息）；确需开启用 DRUID_STAT_ENABLED=true
                enabled: ${DRUID_STAT_ENABLED:false}
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ${DRUID_STAT_USER:ruoyi}
                login-password: ${DRUID_STAT_PASSWORD:123456}
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
            # ====== 补充 DruidProperties 必需字段 ======
            # 防止 @Value 注入失败导致启动崩溃
            poolPreparedStatements: true
            maxPoolPreparedStatementPerConnectionSize: 20
            filters: stat,wall
            loginUsername: druid
            loginPassword: druid123
            ip:


# ============================================================
# 对象存储：阿里云 OSS
# ============================================================
# 凭证一律走环境变量，绝不写进本文件（本文件入 git，写死等于公开泄露）。
# 放 /etc/dytuangou/dytuangou.env，systemd 用 EnvironmentFile= 引入。
# 不用 OSS 想先跑起来：设 STORAGE_TYPE=local（图片存本机磁盘，多实例会丢图）
ruoyi:
  # 上传根目录（local 存储时真正落盘；oss 模式下仅作兼容占位）
  # 默认值原为开发机 /Users/... 绝对路径，服务器上必须覆盖
  profile: ${RUOYI_PROFILE_PATH:/var/dytuangou/uploadPath}
  # 生产不查 IP 归属地（每次请求都要外部调用，拖慢响应）
  addressEnabled: false
  storage:
    type: ${STORAGE_TYPE:oss}
    s3:
      # endpoint 按 bucket 所在 region 改：
      #   华东1（杭州）https://oss-cn-hangzhou.aliyuncs.com
      #   华东2（上海）https://oss-cn-shanghai.aliyuncs.com
      #   华南1（深圳）https://oss-cn-shenzhen.aliyuncs.com
      #   华北2（北京）https://oss-cn-beijing.aliyuncs.com
      endpoint: ${OSS_ENDPOINT:https://oss-cn-hangzhou.aliyuncs.com}
      region: ${OSS_REGION:cn-hangzhou}
      bucket: ${OSS_BUCKET:}
      # RAM 子账号 AccessKey（只授该 bucket 读写，别用主账号 AK）
      # 刻意不给默认值：漏配则启动即报 Could not resolve placeholder，
      # 比"启动成功、上传图片时才失败"更早暴露问题。
      access-key: ${OSS_ACCESS_KEY}
      secret-key: ${OSS_SECRET_KEY}
      # CDN 加速域名（可选，配了之后返回 URL 用它替代 endpoint）
      public-domain: ${OSS_CDN_DOMAIN:wetuango.oss-cn-shenzhen.aliyuncs.com}

# 监听端口（Nginx 反代到此端口）
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8

# 生产日志：关掉框架 debug，落盘便于排查
logging:
  level:
    com.ruoyi: ${LOG_LEVEL_APP:info}
    org.springframework: warn
  file:
    name: ${LOG_PATH:/var/log/dytuangou}/ruoyi-admin.log
